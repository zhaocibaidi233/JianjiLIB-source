# Alembic config. The DB URL is NOT hardcoded here: migrations/env.py resolves it
# from the JIANJI_DATABASE_URL env var first, then falls back to app/db.py
# (which honors JIANJI_DB_PASSWORD / pgpass), i.e. the exact same source the
# app uses at runtime.
#
# NOTE: keep this file ASCII-only. On Windows alembic reads it with the locale
# codec (GBK on zh-CN systems) and non-ASCII comments crash the run -- same
# reason the .bat launchers in this repo are ASCII-only.
[alembic]
script_location = migrations
prepend_sys_path = .
# Keep the modern path separator behavior.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
